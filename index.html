<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>タブ練習</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tabs">
    <button onclick="showTab(1)">タブ1</button>
    <button onclick="showTab(2)">タブ2</button>
    <button onclick="showTab(3)">タブ3</button>
</div>

<div id="tab1" class="tab-content">これはタブ1です</div>
<div id="tab2" class="tab-content" style="display:none;">これはタブ2です</div>
<div id="tab3" class="tab-content" style="display:none;">これはタブ3です</div>

<script>
function showTab(tabNumber) {
    document.getElementById("tab1").style.display = "none";
    document.getElementById("tab2").style.display = "none";
    document.getElementById("tab3").style.display = "none";

    document.getElementById("tab" + tabNumber).style.display = "block";
}
</script>

</body>
</html>
